[project]
name = "aegisops-api"
version = "0.0.0"
description = "AegisOps FastAPI service: ingest, incidents, runs, approvals"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.135",
  "uvicorn[standard]>=0.42",
  "pydantic>=2.13",
  "pydantic-settings>=2.13",
  "structlog>=25.6",
  "aegisops-agent",
  "aegisops-tools",
  "aegisops-alerts",
  "sqlalchemy[asyncio]>=2.0.45",
  "asyncpg>=0.31",
  "alembic>=1.18",
  "pgvector>=0.4",
  "pyyaml>=6.0.3",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisops_api"]
