name: Feature or idea
description: A new capability, scenario, alert rule, integration or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that AegisOps cannot do today? Who runs into this?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would add or change. Sketches, config snippets and links welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: safety
    attributes:
      label: Safety model
      description: See CONTRIBUTING.md. Ideas that need an exception are still welcome; say so below.
      options:
        - label: This keeps detection and verification in code, treats telemetry as untrusted, and adds no path to an action without approval.
  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - Yes, I would like to open a PR
        - Maybe, with some guidance
        - No, just suggesting
