# Weekly, grouped dependency updates (PROJECT.md §14.6, E11.6). Tuesdays so the PRs
# land after the Monday CodeQL run and before the weekend build block.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      python-minor-patch:
        update-types: [minor, patch]
      python-major:
        update-types: [major]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
