# CI for every pull request and every push to main (PROJECT.md §15, E11.2).
# Runs exactly what `make check` runs locally, so a green laptop means a green PR.
# Actions are pinned by commit SHA (§14.6); the version is in the trailing comment.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1" # never resolve in CI; the lockfile is the truth

jobs:
  lint-typecheck:
    name: lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages
      - run: make lint
      - run: make typecheck

  test:
    name: unit + integration (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17 # same image as docker-compose.yml
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis # pragma: allowlist secret
          POSTGRES_DB: aegis
        ports: ["5433:5432"] # same host port as local, so the default AEGIS_DATABASE_URL works
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AEGIS_ENV: test
      AEGIS_DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5433/aegis # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages
      - name: Apply migrations to the fresh database
        run: make db-migrate
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # Pre-commit hooks that are not already covered by lint (YAML/TOML syntax, secrets, whitespace).
  hooks:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  docker-build:
    name: docker build api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: aegisops-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and answers /healthz without a database
        run: |
          docker run -d --rm --name api -p 8080:8080 aegisops-api:ci
          for i in $(seq 1 10); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs api; exit 1
