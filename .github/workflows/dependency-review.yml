# Fails a PR that adds a dependency with a known vulnerability or a disallowed licence (E9.7).
name: dependency-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # summary comment on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Apache-2.0 project: block STRONG copyleft. Weak copyleft (LGPL, MPL) is allowed for
          # unmodified library dependencies (ADR-017); psycopg, needed by LangGraph's Postgres
          # checkpointer, is LGPL-3.0.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0
