# Uptime ping (E8.4): is the public API answering? Runs every 6 hours and on demand.
# A failure turns the workflow red and emails the owner (GitHub's default notification).
# It also requires /readyz (a SELECT 1 on Supabase), which keeps the free-tier
# database from pausing after 7 idle days.
name: uptime

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  URL: https://aegisops-api-875836872466.asia-south1.run.app

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /livez (3 attempts, cold start allowed)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 20 "$URL/livez" || echo 000)
            echo "attempt $i: $code $(cat body.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::/livez did not answer 200 after 3 attempts"; exit 1
      - name: GET /readyz (Supabase reachable; doubles as the keep-alive, E11.5)
        run: |
          # a SELECT 1 every 6 h keeps the free-tier project from pausing after 7 idle days
          for i in 1 2 3; do
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 20 "$URL/readyz" || echo 000)
            echo "attempt $i: $code $(cat body.json 2>/dev/null)"
            [ "$code" = "200" ] && { echo "- \`/readyz\` → 200" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep 10
          done
          echo "::error::/readyz did not answer 200 (Supabase paused or unreachable?)"; exit 1
