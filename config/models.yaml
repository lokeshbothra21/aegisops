# Model routing (E3.5, PROJECT.md §8.4). "provider:model". Providers need
# AEGIS_GEMINI_API_KEY / AEGIS_GROQ_API_KEY in the environment (never in the repo).
# Pinned to exact model ids, not "-latest" aliases, so benchmark results stay reproducible.
# Checked 23 Sep 2026: gemini-2.5-flash-lite is retired for new keys; Groq no longer serves llama-3.3.
primary: gemini:gemini-3.5-flash
secondary: groq:openai/gpt-oss-120b
nodes:
  triage: gemini:gemini-3.5-flash-lite   # cheap model for the cheap step
# List prices in USD per 1M tokens (free tiers bill $0; these make cost-per-run comparable).
# Checked 25 Sep 2026; update when providers change them.
prices:
  gemini-3.5-flash: {in: 0.30, out: 2.50}
  gemini-3.5-flash-lite: {in: 0.10, out: 0.40}
  openai/gpt-oss-120b: {in: 0.15, out: 0.60}
