[project]
name = "aegisops-agent"
version = "0.0.0"
description = "AegisOps agent package"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aegisops-tools",
    "httpx>=0.28",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.13",
    "pyyaml>=6",
    "structlog>=25.6",
]

[project.scripts]
aegis-investigate = "aegisops_agent.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisops_agent"]

[tool.uv.sources]
aegisops-tools = { workspace = true }
