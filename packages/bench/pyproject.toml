[project]
name = "aegisops-bench"
version = "0.0.0"
description = "AegisOps scenarios: catalogue, runner, capture and fixtures (E7.1, E7.2, E1.6)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.13",
  "pyyaml>=6",
  "httpx>=0.28",
  "structlog>=25.6",
  "sqlalchemy[asyncio]>=2.0.45",
  "asyncpg>=0.31",
  "aegisops-tools",
]

[project.scripts]
aegis-scenario = "aegisops_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisops_bench"]
